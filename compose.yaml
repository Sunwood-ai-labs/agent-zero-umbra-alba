name: agent-zero-umbra-alba

include:
  - path: ./dctf/compose.yaml

secrets:
  github_agent_token:
    file: ${GITHUB_AGENT_TOKEN_FILE:-../.menv/github-agent-token}

x-db: &db
  image: postgres:18-alpine
  restart: unless-stopped
  environment:
    POSTGRES_DB: misskey
    POSTGRES_USER: misskey
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 5s
    retries: 30

x-redis: &redis
  image: redis:7-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 30

x-agent: &agent
  image: nousresearch/hermes-agent:v2026.7.20
  restart: unless-stopped
  command:
    - sh
    - -lc
    - >-
      if [ -s "$$NYANKOFACE_FORGEJO_TOKEN_FILE" ]; then
        export NYANKOFACE_MCP_TOKEN="$$(cat "$$NYANKOFACE_FORGEJO_TOKEN_FILE")";
        echo "NyankoFace Forgejo token loaded for Forgejo and MCP";
      else
        echo "NyankoFace Forgejo token is not provisioned; public fallback remains available" >&2;
      fi;
      exec /opt/hermes/bin/hermes gateway run
  environment:
    TZ: Asia/Tokyo
    API_SERVER_ENABLED: "true"
    API_SERVER_HOST: "0.0.0.0"
    API_SERVER_PORT: "8642"
    API_SERVER_KEY: ${HERMES_API_SERVER_KEY}
    GITHUB_TOKEN_FILE: /run/secrets/github_agent_token
    GITHUB_ISSUE_REPO: ${NYANKOFACE_GITHUB_REPO:-Sunwood-ai-labs/NyankoFace}
    NYANKOFACE_PUBLIC_URL: ${NYANKOFACE_PUBLIC_URL:-https://madesk.tail8be30.ts.net}
    NYANKOFACE_FORGEJO_URL: ${NYANKOFACE_FORGEJO_URL:-https://madesk.tail8be30.ts.net/git}
    NYANKOFACE_MCP_URL: ${NYANKOFACE_MCP_URL:-https://madesk.tail8be30.ts.net/mcp}
    NYANKOFACE_FORGEJO_TOKEN_FILE: /opt/data/nyankoface-forgejo-token
  secrets:
    - github_agent_token

services:
  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
      args:
        LITELLM_TAG: ${LITELLM_TAG:-v1.93.0}
    image: agent-zero-umbra-alba-litellm:${LITELLM_TAG:-v1.93.0}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - path: ${LITELLM_PROVIDER_ENV_FILE:-.env.litellm}
        required: false
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    ports:
      - "127.0.0.1:${LITELLM_HOST_PORT:-4002}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    networks: [world-net, black-net, white-net]

  world-db:
    <<: *db
    volumes: ["./runtime/instances/world/db:/var/lib/postgresql"]
    networks: {world-net: {aliases: [db]}}
  world-redis:
    <<: *redis
    volumes: ["./runtime/instances/world/redis:/data"]
    networks: {world-net: {aliases: [redis]}}
  world-config:
    image: python:3.12-alpine
    restart: "no"
    depends_on:
      world-db: {condition: service_healthy}
      world-redis: {condition: service_healthy}
    environment:
      MISSKEY_URL: ${WORLD_PUBLIC_URL:-http://localhost:3310}
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MISSKEY_SETUP_PASSWORD: ${MISSKEY_SETUP_PASSWORD}
    command: ["python", "/app/configure_misskey.py"]
    volumes:
      - ./bootstrap:/app:ro
      - ./.config:/template:ro
      - ./runtime/instances/world:/runtime
    networks: [world-net]
  world-misskey:
    image: misskey/misskey:2026.6.0
    restart: unless-stopped
    depends_on:
      world-config: {condition: service_completed_successfully}
      world-db: {condition: service_healthy}
      world-redis: {condition: service_healthy}
    ports: ["127.0.0.1:3310:3000"]
    environment:
      MISSKEY_URL: ${WORLD_PUBLIC_URL:-http://localhost:3310}
    volumes:
      - ./runtime/instances/world/misskey-config:/misskey/.config:ro
      - ./runtime/instances/world/files:/misskey/files
    networks: [world-net]
  world-bootstrap:
    image: python:3.12-alpine
    restart: "no"
    depends_on:
      world-misskey: {condition: service_started}
      litellm: {condition: service_healthy}
    environment:
      MISSKEY_URL: http://world-misskey:3000
      MISSKEY_PUBLIC_URL: ${WORLD_PUBLIC_URL:-http://localhost:3310}
      MISSKEY_SETUP_PASSWORD: ${MISSKEY_SETUP_PASSWORD}
      MISSKEY_ADMIN_USERNAME: admin
      LITELLM_API_BASE: ${LITELLM_API_BASE}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_MODELS: ${LITELLM_MODELS:-glm-5.2,glm-4.7}
      FACTION: world
      AGENT_INDICES: ""
      GM_CTF_SEASON_ID: ${GM_CTF_SEASON_ID:-CTF-S1}
      GM_CTFD_ID: ${GM_CTFD_ID:-CTFd}
      GM_CTFD_SECURITY_MODE: ${GM_CTFD_SECURITY_MODE:-true}
      GM_CTFD_MIN_DIFFICULTY: ${GM_CTFD_MIN_DIFFICULTY:-hard}
      GM_CTFD_MIN_STAGES: ${GM_CTFD_MIN_STAGES:-3}
      GM_CTFD_MAX_PROBLEMS_PER_FACTION: ${GM_CTFD_MAX_PROBLEMS_PER_FACTION:-8}
      NYANKOFACE_PUBLIC_URL: ${NYANKOFACE_PUBLIC_URL:-https://madesk.tail8be30.ts.net}
      NYANKOFACE_FORGEJO_URL: ${NYANKOFACE_FORGEJO_URL:-https://madesk.tail8be30.ts.net/git}
      NYANKOFACE_MCP_URL: ${NYANKOFACE_MCP_URL:-https://madesk.tail8be30.ts.net/mcp}
      NYANKOFACE_FORGEJO_TOKEN_FILE: ${NYANKOFACE_FORGEJO_TOKEN_FILE:-/opt/data/nyankoface-forgejo-token}
      NYANKOFACE_GITHUB_REPO: ${NYANKOFACE_GITHUB_REPO:-Sunwood-ai-labs/NyankoFace}
      NYANKOFACE_GITHUB_URL: ${NYANKOFACE_GITHUB_URL:-https://github.com/Sunwood-ai-labs/NyankoFace}
      NYANKOFACE_LOCAL_PATH: ${NYANKOFACE_LOCAL_PATH:-}
      NYANKOFACE_SSH_TARGET: ${NYANKOFACE_SSH_TARGET:-}
    command: ["python", "/app/bootstrap.py"]
    volumes:
      - ./bootstrap:/app:ro
      - ./seed:/seed:ro
      - ./assets/avatars:/avatars:ro
      - ./runtime/instances/world:/runtime
    networks: [world-net]

  black-db:
