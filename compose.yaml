name: agent-zero-umbra-alba

secrets:
  github_agent_token:
    file: ${GITHUB_AGENT_TOKEN_FILE:-../.menv/github-agent-token}

x-db: &db
  image: postgres:18-alpine
  restart: unless-stopped
  environment:
    POSTGRES_DB: misskey
    POSTGRES_USER: misskey
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 5s
    retries: 30

x-redis: &redis
  image: redis:7-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 30

x-agent: &agent
  image: nousresearch/hermes-agent:v2026.7.20
  restart: unless-stopped
  command: ["gateway", "run"]
  environment:
    TZ: Asia/Tokyo
    API_SERVER_ENABLED: "true"
    API_SERVER_HOST: "0.0.0.0"
    API_SERVER_PORT: "8642"
    API_SERVER_KEY: ${HERMES_API_SERVER_KEY}
    GITHUB_TOKEN_FILE: /run/secrets/github_agent_token
    GITHUB_ISSUE_REPO: ${NYANKOFACE_GITHUB_REPO:-Sunwood-ai-labs/NyankoFace}
    NYANKOFACE_PUBLIC_URL: ${NYANKOFACE_PUBLIC_URL:-https://madesk.tail8be30.ts.net}
    NYANKOFACE_FORGEJO_URL: ${NYANKOFACE_FORGEJO_URL:-https://madesk.tail8be30.ts.net/git}
    NYANKOFACE_MCP_URL: ${NYANKOFACE_MCP_URL:-https://madesk.tail8be30.ts.net/mcp}
    NYANKOFACE_FORGEJO_TOKEN_FILE: /opt/data/nyankoface-forgejo-token
  secrets:
    - github_agent_token

services:
  world-db:
    <<: *db
    volumes: ["./runtime/instances/world/db:/var/lib/postgresql"]
    networks: {world-net: {aliases: [db]}}
  world-redis:
    <<: *redis
    volumes: ["./runtime/instances/world/redis:/data"]
    networks: {world-net: {aliases: [redis]}}
  world-config:
    image: python:3.12-alpine
    restart: "no"
    depends_on:
      world-db: {condition: service_healthy}
      world-redis: {condition: service_healthy}
    environment:
      MISSKEY_URL: ${WORLD_PUBLIC_URL:-http://localhost:3310}
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MISSKEY_SETUP_PASSWORD: ${MISSKEY_SETUP_PASSWORD}
    command: ["python", "/app/configure_misskey.py"]
    volumes:
      - ./bootstrap:/app:ro
      - ./.config:/template:ro
      - ./runtime/instances/world:/runtime
    networks: [world-net]
  world-misskey:
    image: misskey/misskey:2026.6.0
    restart: unless-stopped
    depends_on:
      world-config: {condition: service_completed_successfully}
      world-db: {condition: service_healthy}
      world-redis: {condition: service_healthy}
    ports: ["127.0.0.1:3310:3000"]
    environment:
      MISSKEY_URL: ${WORLD_PUBLIC_URL:-http://localhost:3310}
    volumes:
      - ./runtime/instances/world/misskey-config:/misskey/.config:ro
      - ./runtime/instances/world/files:/misskey/files
    networks: [world-net]
  world-bootstrap:
    image: python:3.12-alpine
    restart: "no"
    depends_on: {world-misskey: {condition: service_started}}
    environment:
      MISSKEY_URL: http://world-misskey:3000
      MISSKEY_PUBLIC_URL: ${WORLD_PUBLIC_URL:-http://localhost:3310}
      MISSKEY_SETUP_PASSWORD: ${MISSKEY_SETUP_PASSWORD}
      MISSKEY_ADMIN_USERNAME: admin
      LITELLM_API_BASE: ${LITELLM_API_BASE}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_MODELS: ${LITELLM_MODELS:-glm-5.2,glm-4.7}
      FACTION: world
      AGENT_INDICES: ""
      NYANKOFACE_PUBLIC_URL: ${NYANKOFACE_PUBLIC_URL:-https://madesk.tail8be30.ts.net}
      NYANKOFACE_FORGEJO_URL: ${NYANKOFACE_FORGEJO_URL:-https://madesk.tail8be30.ts.net/git}
      NYANKOFACE_MCP_URL: ${NYANKOFACE_MCP_URL:-https://madesk.tail8be30.ts.net/mcp}
      NYANKOFACE_FORGEJO_TOKEN_FILE: ${NYANKOFACE_FORGEJO_TOKEN_FILE:-/opt/data/nyankoface-forgejo-token}
      NYANKOFACE_GITHUB_REPO: ${NYANKOFACE_GITHUB_REPO:-Sunwood-ai-labs/NyankoFace}
      NYANKOFACE_GITHUB_URL: ${NYANKOFACE_GITHUB_URL:-https://github.com/Sunwood-ai-labs/NyankoFace}
      NYANKOFACE_LOCAL_PATH: ${NYANKOFACE_LOCAL_PATH:-}
      NYANKOFACE_SSH_TARGET: ${NYANKOFACE_SSH_TARGET:-}
    command: ["python", "/app/bootstrap.py"]
    volumes:
      - ./bootstrap:/app:ro
      - ./seed:/seed:ro
      - ./assets/avatars:/avatars:ro
      - ./runtime/instances/world:/runtime
    networks: [world-net]

  black-db:
    <<: *db
    volumes: ["./runtime/instances/black/db:/var/lib/postgresql"]
    networks: {black-net: {aliases: [db]}}
  black-redis:
